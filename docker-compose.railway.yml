# Local full-stack compose simulating Railway topology.
# Railway provides managed Postgres — the db service here is for local testing only.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: chalkboard
      POSTGRES_USER: chalkboard
      POSTGRES_PASSWORD: ${DB_PASSWORD:-localdev}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chalkboard"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql://chalkboard:${DB_PASSWORD:-localdev}@db:5432/chalkboard
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://chalkboard:${DB_PASSWORD:-localdev}@db:5432/chalkboard
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:?DASHBOARD_PASSWORD required}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET required}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      DATABASE_URL: postgresql://chalkboard:${DB_PASSWORD:-localdev}@db:5432/chalkboard
      GEMINI_API_KEY: ${GEMINI_API_KEY:?GEMINI_API_KEY required}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      CHALKBOARD_SLACK_WEBHOOK: ${CHALKBOARD_SLACK_WEBHOOK:-}
      CHALKBOARD_BASE_URL: ${CHALKBOARD_BASE_URL:-http://localhost:3000}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
