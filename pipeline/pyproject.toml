[project]
name = "chalkboard-pipeline"
version = "0.1.0"
description = "Chalkboard STEM lecture processing pipeline"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=1.0,<2.0",
    "google-cloud-speech>=2.37,<3.0",
    "google-cloud-storage>=2.18,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.14,<2.0",
    "psycopg2-binary>=2.9,<3.0",
    "python-dotenv>=1.0,<2.0",
    "boto3>=1.35,<2.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.34,<1.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py312"
line-length = 100
